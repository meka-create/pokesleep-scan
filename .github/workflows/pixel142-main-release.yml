name: Pixel142 OCR main release regression

on:
  push:
    branches:
      - main
      - revival/pixel142-main-promotion-20261012
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel142-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: JavaScript syntax and PWA release coherence
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js sw.js master_data.js classifier.js food_matcher.js shared_master.js android_roi.js csv_gate.js; do
            node --check "$f"
          done
          python - <<'PY'
          import json,pathlib,re
          release=json.loads(pathlib.Path('release.json').read_text(encoding='utf-8'))['id']
          sw=pathlib.Path('sw.js').read_text(encoding='utf-8')
          app=pathlib.Path('app.js').read_text(encoding='utf-8')
          assert "const RELEASE_ID = '"+release+"';" in sw, 'Service worker cache/release mismatch'
          assert "CHECKPOINT_RELEASE_ID='"+release+"'" in app, 'Checkpoint release mismatch'
          assert 'function markFoodReviews' in app and 'const androidRoiEnabled=true;' in app and 'function openImageSelectDialog' in app and 'function closeImageSelectDialog' in app and "$('#addFilesButton')" not in app and 'STEP3_ANDROID_ROI_STORAGE_KEY' not in app and 'corroboratedJointMissingNatureRescue' in app and 'retryMissingCarryFromVisibleCard' in app and 'shiftedCarrySearchRects' in app and 'carryOcrUnresolved' in app and 'function carryManualChoices' not in app and 'function applyManuallyVerifiedCarry' not in app
          print('Release/cache/diagnostics OCR identity PASS:',release)
          PY
      - name: Independent tracked-file release manifest snapshot
        run: python development/generate_public_package_manifest.py --stdout
      - name: Verify SHA-256 manifest matches every tracked file
        run: python development/generate_public_package_manifest.py --check
      - name: Reject private dataset and unpublished artifact paths (synthetic only)
        run: python -m unittest discover -s development -p 'test_public_package_privacy.py' -v
      - name: STEP 2 meka142 private benchmark evaluator safety tests (synthetic only)
        run: python -m unittest discover -s development -p 'test_step2_meka142_benchmark.py' -v
      - name: Final private evidence gate negative controls (synthetic only)
        run: python -m unittest discover -s development -p 'test_final_evidence_gate.py' -v
      - name: Offline 18-column private round-trip acceptance tool regression (synthetic only)
        run: python -m unittest discover -s development -p 'test_csv18_roundtrip_acceptance.py' -v
      - name: Prepare transparent food sprite regression
        run: python -m pip install Pillow==11.3.0
      - name: Simulate October 5 species addition and upstream failures
        run: python -m unittest discover -s development -p 'test_master_auto_update.py' -v
      - name: Real upstream projection dry-run (no publishing)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch https://github.com/nitoyon/pokesleep-tool.git "$RUNNER_TEMP/upstream"
          python development/master_auto_update.py --upstream "$RUNNER_TEMP/upstream"
      - name: STEP 3 real pokesleep-tool Japanese CSV importer compatibility
        shell: bash
        run: |
          set -euo pipefail
          # Upstream was cloned for the master projection check above.
          node development/generate_upstream_import_fixture.cjs "$RUNNER_TEMP/scan-produced.csv"
          cp development/step3_real_upstream_importer.test.ts "$RUNNER_TEMP/upstream/src/util/Formatter/ScanStep3Importer.test.ts"
          ( cd "$RUNNER_TEMP/upstream"
            npm ci --ignore-scripts --no-audit --no-fund
            SCAN_MASTER_PATH="$GITHUB_WORKSPACE/shared/MASTER_DATA.json" SCAN_EXPORTED_CSV_PATH="$RUNNER_TEMP/scan-produced.csv" npx vitest run src/util/Formatter/ScanStep3Importer.test.ts --reporter=dot
          )
      - name: Kana-folded prefix-search and nickname-caption regression
        run: node --test development/review_picker_kana_prefix.test.cjs
      - name: Compact source-image button regression
        run: node --test development/image_button_compact.test.cjs
      - name: Independent updater production Pages deployment tests
        run: node --test development/master_deploy_workflow.test.cjs
      - name: Master warning and health publisher tests
        run: |
          node --test development/master_update_status.test.cjs
          python -m unittest discover -s development -p 'test_master_status.py' -v
      - name: Independent master safety unit tests
        run: node --test development/master_auto_update.test.cjs
      - name: Runtime master and classifier smoke tests
        run: node --test development/runtime_smoke.test.cjs
      - name: Shared master and CSV compatibility
        run: node --test development/step2_shared_csv.test.cjs
      - name: Android ROI and review UX
        run: node --test development/step3_dimmed_food_conflict.test.cjs development/step3_mystical_fire_sp.test.cjs development/layout_cropped_banner.test.cjs development/step3_android_roi.test.cjs
      - name: Pixel142 false-acceptance safety
        run: node --test development/step3_pixel142_safety.test.cjs
      - name: Independent header SP and subskill review safety
        run: node --test development/step3_header_sp_subskill_review.test.cjs
      - name: Mew skill, nickname small-kana and passive performance safety
        run: node --test development/step3_meka142_targeted_quality.test.cjs
      - name: Two-field corroborated OCR rescue
        run: node --test development/step3_joint_rescue.test.cjs
      - name: STEP 2 mythical optional food no-template regression
        run: node --test development/step2_mythical_food_sentinel.test.cjs
      - name: STEP 2 mythical blank subskill dash pixel-proof regression
        run: node --test development/step2_mythical_subskill_dash.test.cjs
      - name: STEP 2 mythical empty third-food dash pixel-proof regression
        run: node --test development/step2_mythical_empty_dash.test.cjs
      - name: STEP 2 strict locked second-food within-image witness regression
        run: node --test development/locked_food2_self_witness.test.cjs
      - name: STEP 2 third-food independent-icon corroboration regression
        run: node --test development/step2_food3_selfmatch.test.cjs
      - name: STEP 2 fresh asset query and diagnostics fingerprint
        run: node --test development/step2_asset_revision.test.cjs
      - name: STEP 2 locked third-food independent pixel witness (strict negative controls)
        run: node --test development/step2_food3_independent_pixel_witness.test.cjs
      - name: Nickname level-caption review-only candidate regression
        run: node --test development/nickname_caption_rescue.test.cjs development/nickname_spatial_advisory.test.cjs
      - name: Verified-level nickname candidate priority (review only)
        run: node --test development/nickname_level_candidate_ranking.test.cjs
      - name: Narrow 85-89 independent Lv caption consensus safety (synthetic only)
        run: node --test development/nickname_lv_consensus85.test.cjs
      - name: Conservative multi-OCR nickname review promotion regression
        run: node --test development/nickname_consensus_autoconfirm.test.cjs
      - name: Frozen nickname pipeline SHA-256 non-regression
        run: node --test development/nickname_freeze.test.cjs
      - name: Passive Tesseract and per-image performance timing tests
        run: node --test development/performance_profile.test.cjs
      - name: Sustained OCR speed-warning detection regression
        run: node --test development/speed_warning.test.cjs
      - name: Paddle 90-second user-controlled wait and fallback regressions
        run: node --test development/paddle_wait_choice.test.cjs
      - name: Private nickname acceptance gate synthetic regressions
        run: python -m unittest discover -s development -p 'test_nickname_meka142_gate.py' -v
      - name: Missing carry and third-food advisory regression
        run: node --test development/step3_carry_food3.test.cjs development/failure_card_actions.test.cjs
      - name: Prepare real Chromium browser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Direct Files picker regression
        run: node --test development/image_source_choice.test.cjs
      - name: Real Chromium UI boot and cache tests
        run: python development/browser_boot_smoke.py
      - name: Real Chromium unified desktop and phone card layout
        run: python development/browser_unified_mobile_layout.py
      - name: Real Chromium kana picker UX regression
        run: python development/browser_choice_picker_kana.py
      - name: Real Chromium append-after-analysis reset and duplicate safety
        run: python development/browser_append_after_results.py
      - name: Real Chromium Android review UX tests
        run: python development/browser_step3_review_audit.py
      - name: Real Chromium CSV download and preflight tests
        run: python development/browser_csv_download_audit.py

  # UI safety is verified independently because a real upstream master HOLD
  # must not prevent us from checking unrelated interface changes.
  failure-card-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Failure-card deletion and modal synthetic tests
        run: node --test development/failure_card_actions.test.cjs development/image_button_compact.test.cjs
      - name: Set up Chromium for focused UI checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium Paddle 90-second choice and interrupted modal
        run: python development/browser_paddle_wait_choice.py
      - name: Real Chromium synthetic failure-card and dialogs
        run: python development/browser_failure_card_modal.py
      - name: Existing real Chromium UI and CSV regressions
        run: |
          python development/browser_boot_smoke.py
          python development/browser_unified_mobile_layout.py
          python development/browser_choice_picker_kana.py
          python development/browser_append_after_results.py
          python development/browser_step3_review_audit.py
          python development/browser_csv_download_audit.py

  # Future-release simulation is independent of the present 251-entry upstream HOLD.
  # Never publishes synthetic values. Running this on PR verifies the real upstream
  # CSV importer along with the OCR master's Node/Python projections.
  oct26-future-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Clone live upstream in isolated runner
        run: git clone --depth 1 --single-branch https://github.com/nitoyon/pokesleep-tool.git "$RUNNER_TEMP/oct26-upstream"
      - name: Future-release master projection (synthetic numbers only)
        run: python development/verify_oct26_preflight.py "$RUNNER_TEMP/oct26-upstream" "$RUNNER_TEMP/oct26-master.json"
      - name: 251-species runtime, simulated classifier, and CSV gate
        run: node development/verify_oct26_classify_csv.cjs "$RUNNER_TEMP/oct26-master.json"
      - name: Real pokesleep-tool 251-species CSV importer roundtrip
        run: |
          cp development/step3_real_upstream_importer.test.ts "$RUNNER_TEMP/oct26-upstream/src/util/Formatter/ScanStep3Importer.test.ts"
          cd "$RUNNER_TEMP/oct26-upstream"
          npm ci --ignore-scripts --no-audit --no-fund
          SCAN_MASTER_PATH="$RUNNER_TEMP/oct26-master.json" npx vitest run src/util/Formatter/ScanStep3Importer.test.ts --reporter=dot
      - name: Simulate next daily update after synthetic 251-species master was already published
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/oct26-master.json" shared/MASTER_DATA.json
          python -m pip install Pillow==11.3.0
          python -m unittest discover -s development -p 'test_master_auto_update.py' -v
          echo 'POST-PROMOTION REGRESSION: synthetic 251+ species master passed the daily updater test suite'
