name: Independent master auto-update
on:
  schedule:
    - cron: '0 19 * * *' # 毎日午前4:00 JST (19:00 UTC); GitHub Actions may start later
  # On STEP 1's initial merge, bootstrap the first status and deployed master.
  # Bot-made commits do not recursively trigger this event.
  push:
    branches: [main]
    paths: ['.github/workflows/independent-master-sync.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokesleep-scan-master-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      overdue_new_species: ${{ steps.stage.outputs.overdue_new_species }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone upstream at a single SHA; do not execute untrusted code
        run: git clone --depth 1 --single-branch https://github.com/nitoyon/pokesleep-tool.git "$RUNNER_TEMP/upstream"
      - name: Prepare food sprite generator
        run: python -m pip install Pillow==11.3.0
      - name: Stage, validate, test and refresh self-owned release metadata
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python development/master_auto_update.py --upstream "$RUNNER_TEMP/upstream" --apply | tee "$RUNNER_TEMP/master-sync-report.txt"
          python development/register_food_icons.py
          python development/generate_public_package_manifest.py --write
          python -m unittest discover -s development -p 'test_master_auto_update.py' -v
          python -m unittest discover -s development -p 'test_master_status.py' -v
          node --check app.js
          node --check classifier.js
          node --check food_matcher.js
          node --test development/runtime_smoke.test.cjs development/step2_shared_csv.test.cjs development/master_auto_update.test.cjs
          python development/generate_public_package_manifest.py --check
          # The importer prints one machine-readable JSON report before its
          # optional PROMOTED line. Propagate only the verified overdue flag.
          python - <<'PY'
          import json,os,pathlib
          report=(pathlib.Path(os.environ["RUNNER_TEMP"])/"master-sync-report.txt").read_text(encoding="utf-8")
          status=json.loads(report.splitlines()[0])
          pending=bool(status.get("overdueNewSpecies",[]))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"overdue_new_species={str(pending).lower()}\n")
          print("Post-arrival provisional species:",pending)
          PY
      - name: Commit only validated master + release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- shared/MASTER_DATA.json shared/master_release.json food_color_features.js app.js sw.js release.json public_package_manifest.json
          if git diff --cached --quiet; then echo 'No upstream master changes'; exit 0; fi
          git diff --cached --check
          git commit -m 'data: sync upstream independently'
          git push origin HEAD:main

  publish-status:
    needs: [sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Report the sync outcome from a fresh main checkout, never from rejected master changes
        shell: bash
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
          OVERDUE_NEW_SPECIES: ${{ needs.sync.outputs.overdue_new_species }}
        run: |
          set -euo pipefail
          python development/publish_master_status.py --result "$SYNC_RESULT" --pending "${OVERDUE_NEW_SPECIES:-false}"
          python development/generate_public_package_manifest.py --write
          python development/generate_public_package_manifest.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- master-update-status.json public_package_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record independent master update health'
          git push origin HEAD:main

  deploy-pages:
    needs: [sync, publish-status]
    if: always() && needs.publish-status.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify the final public state and its release hashes
        run: python development/generate_public_package_manifest.py --check
      - name: Upload the latest published tree after updating health
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the synchronized master and health JSON
        id: deployment
        uses: actions/deploy-pages@v4
