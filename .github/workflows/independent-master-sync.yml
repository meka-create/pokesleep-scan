name: Independent master auto-update
on:
  schedule:
    - cron: '0 19 * * *' # 毎日午前4:00 JST (19:00 UTC); GitHub Actions may start later
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokesleep-scan-master-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone upstream at a single SHA; do not execute untrusted code
        run: git clone --depth 1 --single-branch https://github.com/nitoyon/pokesleep-tool.git "$RUNNER_TEMP/upstream"
      - name: Prepare food sprite generator
        run: python -m pip install Pillow==11.3.0
      - name: Stage, validate, test and refresh self-owned release metadata
        shell: bash
        run: |
          set -euo pipefail
          python development/master_auto_update.py --upstream "$RUNNER_TEMP/upstream" --apply
          python development/register_food_icons.py
          python development/generate_public_package_manifest.py --write
          python -m unittest discover -s development -p 'test_master_auto_update.py' -v
          python -m unittest discover -s development -p 'test_master_status.py' -v
          node --check app.js
          node --check classifier.js
          node --check food_matcher.js
          node --test development/runtime_smoke.test.cjs development/step2_shared_csv.test.cjs development/master_auto_update.test.cjs
          python development/generate_public_package_manifest.py --check
      - name: Commit only validated master + release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- shared/MASTER_DATA.json shared/master_release.json food_color_features.js app.js sw.js release.json public_package_manifest.json
          if git diff --cached --quiet; then echo 'No upstream master changes'; exit 0; fi
          git diff --cached --check
          git commit -m 'data: sync upstream independently'
          git push origin HEAD:main

  publish-status:
    needs: [sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Report the sync outcome from a fresh main checkout, never from rejected master changes
        shell: bash
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          set -euo pipefail
          python development/publish_master_status.py --result "$SYNC_RESULT"
          python development/generate_public_package_manifest.py --write
          python development/generate_public_package_manifest.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- master-update-status.json public_package_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record independent master update health'
          git push origin HEAD:main
